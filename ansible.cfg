
[defaults]
#inventory = ./inventories/dev/hosts
vault_password_file = ~/.ansible_vault_pass
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
# 1. Включаем подробный JSON-вывод в терминале (заменяет стандартный вывод)
stdout_callback = ansible.builtin.default

# 2. Форматируем вывод в yaml вместо json для читаемости
callback_result_format = yaml

# 2. Включаем дополнительные плагины: профилирование времени задач + запись в лог-файл
callbacks_enabled = ansible.posix.profile_tasks, community.general.log_plays

# 3. (Опционально) Задаём путь для лог-файла log_plays
[callback_log_plays]
log_folder = /tmp/ansible_logs

# 4. Настраиваем профилирование для отображения самых медленных задач
[callback_profile_tasks]
sort_order = descending
task_output_limit = 10
